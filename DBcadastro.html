<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DB Cadastro — Usuários</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8 font-sans antialiased">

  <div class="max-w-5xl mx-auto space-y-6">
    <!-- Cabeçalho -->
    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
      <div>
        <h1 class="text-2xl font-bold text-gray-900">Gerenciamento de Cadastros (DB)</h1>
        <p class="text-sm text-gray-500">Cadastre novos usuários e visualize os registros armazenados no SQLite</p>
      </div>
      <a
        href="DB.html"
        class="inline-block py-2.5 px-4 bg-gray-100 hover:bg-gray-200 text-gray-800 font-semibold text-sm rounded-lg border border-gray-300 text-center transition-colors"
      >
        Voltar para o Login
      </a>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <!-- Formulário de Novo Cadastro -->
      <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 h-fit">
        <h2 class="text-lg font-bold text-gray-900 mb-4">Novo Cadastro</h2>

        <div id="mensagem" class="hidden p-3 rounded-lg mb-4 text-sm font-medium border"></div>

        <form id="form-db-cadastro" class="space-y-4">
          <div>
            <label for="nome" class="block text-sm font-medium text-gray-700 mb-1">Nome completo</label>
            <input
              type="text"
              id="nome"
              required
              placeholder="Ex: Maria Silva"
              class="w-full px-3.5 py-2.5 border border-gray-300 rounded-lg text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
            >
          </div>

          <div>
            <label for="email" class="block text-sm font-medium text-gray-700 mb-1">E-mail</label>
            <input
              type="email"
              id="email"
              required
              placeholder="maria@exemplo.com"
              class="w-full px-3.5 py-2.5 border border-gray-300 rounded-lg text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
            >
          </div>

          <div>
            <label for="senha" class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
            <input
              type="password"
              id="senha"
              required
              minlength="4"
              placeholder="••••••••"
              class="w-full px-3.5 py-2.5 border border-gray-300 rounded-lg text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
            >
          </div>

          <button
            type="submit"
            class="w-full py-2.5 px-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg transition-colors cursor-pointer"
          >
            Salvar no Banco
          </button>
        </form>
      </div>

      <!-- Tabela de Registros do Banco de Dados -->
      <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 lg:col-span-2">
        <div class="flex items-center justify-between mb-4">
          <div>
            <h2 class="text-lg font-bold text-gray-900">Usuários no Banco (<span id="total-usuarios">0</span>)</h2>
            <p class="text-xs text-gray-500">As senhas são armazenadas com hash criptografado e não são exibidas</p>
          </div>
          <button
            type="button"
            id="btn-atualizar"
            class="py-1.5 px-3 bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-medium rounded-lg border border-gray-300 transition-colors cursor-pointer"
          >
            Atualizar
          </button>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="border-b border-gray-200 text-xs font-semibold text-gray-500 uppercase">
                <th class="py-3 px-3">ID</th>
                <th class="py-3 px-3">Nome</th>
                <th class="py-3 px-3">E-mail</th>
                <th class="py-3 px-3">Criado em</th>
                <th class="py-3 px-3 text-right">Ação</th>
              </tr>
            </thead>
            <tbody id="tabela-usuarios" class="divide-y divide-gray-100 text-sm text-gray-700">
              <tr>
                <td colspan="5" class="py-6 text-center text-gray-400">Carregando registros...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="DBcadastro.js"></script>
</body>
</html>

<!-- DB CADASTRO.HTML -->
