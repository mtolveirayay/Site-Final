<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Control • Chat</title>
    <script>
        // Verificação imediata: apenas usuários autenticados têm acesso à IA
        const usuarioLogado = localStorage.getItem('usuarioLogado');
        if (!usuarioLogado) {
            alert('Acesso restrito: Por favor, faça login para acessar o assistente de IA.');
            window.location.href = '../../DB.html?redirect=ia';
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;500;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        .markdown-content {
            font-size: 0.95rem;
            line-height: 1.65;
            color: rgba(255, 255, 255, 0.95);
        }
        .markdown-content p {
            margin-bottom: 0.75rem;
            text-align: justify;
            text-justify: inter-word;
        }
        .markdown-content p:last-child {
            margin-bottom: 0;
        }
        .markdown-content h1,
        .markdown-content h2,
        .markdown-content h3,
        .markdown-content h4 {
            font-family: 'League Spartan', sans-serif;
            color: #E6A06F;
            font-weight: 700;
            margin-top: 1rem;
            margin-bottom: 0.5rem;
        }
        .markdown-content h1 { font-size: 1.35rem; }
        .markdown-content h2 { font-size: 1.2rem; }
        .markdown-content h3 { font-size: 1.05rem; }
        .markdown-content ul {
            list-style-type: disc;
            padding-left: 1.4rem;
            margin-top: 0.5rem;
            margin-bottom: 0.75rem;
        }
        .markdown-content ol {
            list-style-type: decimal;
            padding-left: 1.4rem;
            margin-top: 0.5rem;
            margin-bottom: 0.75rem;
        }
        .markdown-content li {
            margin-bottom: 0.25rem;
        }
        .markdown-content blockquote {
            border-left: 3px solid #E6A06F;
            padding: 0.4rem 0.75rem;
            margin: 0.75rem 0;
            font-style: italic;
            color: rgba(255, 255, 255, 0.85);
            background: rgba(230, 160, 111, 0.08);
            border-radius: 0 0.375rem 0.375rem 0;
        }
        .markdown-content pre {
            background-color: #1a1c29;
            border: 1px solid rgba(158, 156, 113, 0.3);
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
            margin: 0.75rem 0;
            overflow-x: auto;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.875rem;
        }
        .markdown-content code {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.85em;
            background-color: rgba(26, 28, 41, 0.7);
            color: #E6A06F;
            padding: 0.15rem 0.35rem;
            border-radius: 0.25rem;
            border: 1px solid rgba(230, 160, 111, 0.25);
        }
        .markdown-content pre code {
            background-color: transparent;
            padding: 0;
            border: none;
            color: #f3f4f6;
        }
        /* Tabelas Markdown estilizadas */
        .markdown-content table {
            width: 100%;
            margin: 0.85rem 0;
            border-collapse: collapse;
            font-size: 0.875rem;
            border-radius: 0.5rem;
            overflow: hidden;
            border: 1px solid rgba(158, 156, 113, 0.4);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
        }
        .markdown-content th {
            background-color: #33454E;
            color: #E6A06F;
            font-weight: 700;
            padding: 0.65rem 0.85rem;
            text-align: left;
            border: 1px solid rgba(158, 156, 113, 0.35);
        }
        .markdown-content td {
            padding: 0.55rem 0.85rem;
            border: 1px solid rgba(158, 156, 113, 0.25);
            color: rgba(255, 255, 255, 0.95);
        }
        .markdown-content tr:nth-child(even) {
            background-color: rgba(36, 39, 57, 0.45);
        }
        .markdown-content tr:hover {
            background-color: rgba(230, 160, 111, 0.12);
        }
        .markdown-content a {
            color: #E6A06F;
            text-decoration: underline;
        }
        .markdown-content a:hover {
            color: #ffffff;
        }
        .markdown-content hr {
            border: none;
            border-top: 1px solid rgba(158, 156, 113, 0.3);
            margin: 1rem 0;
        }
        /* Fórmulas matemáticas e notação KaTeX */
        .markdown-content .katex {
            font-size: 1.05em;
            color: #ffffff;
        }
        .markdown-content .katex-display,
        .markdown-content .katex-display-wrapper {
            display: block;
            margin: 0.85rem 0;
            padding: 0.75rem 1rem;
            background-color: rgba(26, 28, 41, 0.65);
            border: 1px solid rgba(230, 160, 111, 0.3);
            border-radius: 0.6rem;
            overflow-x: auto;
            overflow-y: hidden;
            text-align: center;
        }
        .markdown-content .katex-display > .katex {
            text-align: center;
            white-space: nowrap;
        }
    </style>
</head>

<body class="relative scrollbar-none flex h-screen flex-col overflow-hidden bg-gradient-to-r from-[#5E8271] to-[#33454E] font-['Roboto',sans-serif] text-white">

    <!-- Barra Superior -->
    <header class="flex min-h-[60px] shrink-0 w-full items-center justify-between border-b border-[#242739]/30 bg-[#9E9C71] px-4 py-2.5 shadow-md z-30">
        <div class="flex items-center gap-3">
            <button
                type="button"
                id="btn-toggle-sidebar"
                title="Histórico de conversas"
                class="flex cursor-pointer items-center gap-1.5 rounded-lg bg-[#242739]/15 px-2.5 py-1.5 text-[#242739] font-bold text-xs transition hover:bg-[#242739] hover:text-white sm:text-sm"
            >
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
                <span>Histórico</span>
            </button>

            <a href="../../index.html" class="flex items-center gap-1 text-sm font-bold text-[#242739] transition hover:text-white sm:text-base">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
                </svg>
                Voltar
            </a>
        </div>

        <h1 class="font-['League_Spartan',sans-serif] text-lg font-extrabold tracking-wide text-[#242739] sm:text-2xl">
            AI Control • Assistente
        </h1>

        <div class="flex items-center gap-2">
            <div id="usuario-badge" class="hidden sm:flex items-center gap-1.5 rounded-lg bg-[#242739]/15 px-2.5 py-1 text-xs font-semibold text-[#242739]">
                <span id="nome-usuario-chat"></span>
                <button type="button" id="btn-sair-chat" title="Sair da conta" class="ml-1 text-red-800 hover:text-red-950 font-bold underline cursor-pointer">Sair</button>
            </div>

            <button
                type="button"
                id="btn-novo-chat-topo"
                class="flex items-center gap-1.5 rounded-lg bg-[#242739] px-3.5 py-1.5 text-xs font-bold text-[#E6A06F] shadow-sm transition hover:bg-[#33454E] hover:text-white sm:text-sm"
            >
                <span class="text-base leading-none">+</span>
                <span class="hidden sm:inline">Nova conversa</span>
            </button>
        </div>
    </header>

    <!-- Estrutura Principal: Sidebar + Chat -->
    <div class="relative flex flex-1 overflow-hidden">

        <!-- Overlay para mobile -->
        <div
            id="sidebar-overlay"
            class="fixed inset-0 z-20 hidden bg-black/50 backdrop-blur-xs transition-opacity md:hidden"
        ></div>

        <!-- Sidebar / Histórico de Conversas (Persistente no SQLite) -->
        <aside
            id="sidebar"
            class="fixed inset-y-0 left-0 z-25 flex w-72 max-w-[85vw] flex-col border-r border-[#9E9C71]/30 bg-[#242739] shadow-2xl transition-transform duration-300 -translate-x-full md:static md:w-80 md:translate-x-0"
        >
            <!-- Topo da Sidebar: Botão de Nova Conversa -->
            <div class="p-4 border-b border-[#9E9C71]/20">
                <button
                    type="button"
                    id="btn-nova-conversa"
                    class="flex w-full cursor-pointer items-center justify-center gap-2 rounded-xl border border-[#E6A06F]/50 bg-[#E6A06F] px-4 py-3 font-['League_Spartan',sans-serif] text-base font-bold text-[#242739] shadow-md transition hover:bg-[#9E9C71] hover:text-white"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                    </svg>
                    Nova Conversa
                </button>
            </div>

            <!-- Título do Histórico -->
            <div class="px-4 pt-3 pb-1 flex items-center justify-between text-xs font-bold uppercase tracking-wider text-[#9E9C71]">
                <span>Histórico de Conversas</span>
                <span id="contador-conversas" class="rounded bg-[#33454E] px-1.5 py-0.5 text-[10px] text-white/80">0</span>
            </div>

            <!-- Lista de Conversas Carregadas do SQLite -->
            <div
                id="lista-conversas"
                class="flex-1 space-y-1.5 overflow-y-auto p-3 scrollbar-none [&::-webkit-scrollbar]:hidden [scrollbar-width:none]"
            >
                <div class="p-4 text-center text-xs text-[#9E9C71]">
                    Carregando conversas...
                </div>
            </div>

            <!-- Rodapé da Sidebar: Indicação do Banco de Dados -->
            <div class="p-3 border-t border-[#9E9C71]/20 bg-[#242739]/80 text-center">
                <span class="inline-flex items-center gap-1.5 text-xs text-[#9E9C71]">
                    <span class="h-2 w-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    
                </span>
            </div>
        </aside>

        <!-- Área Principal de Mensagens -->
        <main class="flex flex-1 flex-col min-w-0 bg-gradient-to-br from-[#242739]/40 via-transparent to-[#242739]/30">

            <!-- Barra de Título da Conversa Ativa -->
            <div class="flex items-center justify-between border-b border-white/10 bg-[#242739]/50 px-4 py-2 backdrop-blur-xs">
                <div class="flex items-center gap-2 truncate">
                    <span class="text-xs font-medium text-[#9E9C71]">Conversa:</span>
                    <span id="titulo-conversa-ativa" class="truncate text-sm font-bold text-white sm:text-base">
                        Nova Conversa
                    </span>
                </div>
            </div>

            <!-- Container das Mensagens (Scrollável) -->
            <div
                id="chat-container"
                class="flex-1 space-y-4 overflow-y-auto p-4 sm:p-6 scroll-smooth"
            >
                <!-- Mensagem de boas-vindas inicial -->
                <div class="flex items-start gap-3">
                    <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-[#E6A06F] text-sm font-bold text-[#242739]">
                        IA
                    </div>
                    <div class="max-w-[85%] rounded-2xl rounded-tl-sm border border-[#9E9C71]/40 bg-[#242739]/80 px-5 py-3.5 shadow-md">
                        <p class="whitespace-pre-line text-sm leading-relaxed text-white/95 sm:text-base">
                            Olá! Eu sou o assistente do <strong>AI Control</strong>. Suas conversas ficam salvas no histórico lateral com títulos gerados automaticamente pela IA.<br><br>Como posso te orientar nos seus estudos hoje?
                        </p>
                    </div>
                </div>
            </div>

            <!-- Formulário de Envio -->
            <div class="p-3 sm:p-4 bg-[#242739]/60 border-t border-white/10">
                <form id="chat-form" class="mx-auto flex max-w-4xl items-center gap-3">
                    <input
                        type="text"
                        id="campo-pergunta"
                        placeholder="Digite sua dúvida para começar..."
                        aria-label="Pergunta para a IA"
                        autocomplete="off"
                        class="w-full rounded-full border border-white/20 bg-white px-5 py-3 text-sm text-[#242739] shadow-lg outline-none placeholder:text-[#33454E]/60 focus:ring-2 focus:ring-[#E6A06F] sm:py-3.5 sm:text-base"
                    >
                    <button
                        type="submit"
                        id="btn-enviar"
                        class="flex shrink-0 cursor-pointer items-center justify-center gap-2 rounded-full bg-[#E6A06F] px-5 py-3 font-['League_Spartan',sans-serif] text-sm font-bold text-[#242739] shadow-lg transition duration-200 hover:bg-[#9E9C71] hover:text-white disabled:opacity-50 disabled:cursor-not-allowed sm:px-6 sm:py-3.5 sm:text-base"
                    >
                        <span>Enviar</span>
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                        </svg>
                    </button>
                </form>
            </div>

        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
